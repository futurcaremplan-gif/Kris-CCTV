name: Build Kris CCTV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract CCTV project
        run: unzip -q Kris-CCTV-RTSP-v4-UDP-FIX.zip

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > kris-cctv/gradle.properties
          echo "android.enableJetifier=true" >> kris-cctv/gradle.properties

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: kris-cctv
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kris-CCTV-v2-apk
          path: kris-cctv/app/build/outputs/apk/debug/app-debug.apk
